
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Island Cake AR</title>

  <!-- A-Frame: renders the AR scene -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR: recognizes our postcard -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <!-- The video file -->
  <a-assets>
    <video
      id="postcardVideo"
      src="./Sequence%2001_1.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      loop>
    </video>
  </a-assets>

  <!-- Button to enable sound on mobile -->
  <button id="startButton"
    style="position:absolute; z-index:1000;
           top:20px; left:20px; padding:12px;">
    Enable sound
  </button>

  <!-- AR scene -->
  <a-scene
    mindar-image="
     imageTargetSrc: ./targets.mind;
     autoStart: true;
     filterMinCF: 0.01;
     filterBeta: 0.1;
     warmupTolerance: 5;
     missTolerance: 10;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Postcard tracking target -->
    <a-entity
      id="postcardTarget"
      mindar-image-target="targetIndex: 0">

      <!-- Animation displayed over postcard -->
      <a-video
        src="#postcardVideo"
        position="0 0 0.01"
        width="1"
        height="0.711">
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector("#postcardTarget");
    const video = document.querySelector("#postcardVideo");
    const startButton = document.querySelector("#startButton");

    let soundEnabled = false;
    let targetVisible = false;

    video.muted = true;

    startButton.addEventListener("click", async () => {
      try {
        video.muted = false;
        await video.play();
        soundEnabled = true;
        if (!targetVisible) video.pause();
        startButton.style.display = "none";
      } catch (error) {
        video.muted = true;
        console.log("Sound could not start:", error);
      }
    });

    target.addEventListener("targetFound", async () => {
      targetVisible = true;
      video.currentTime = 0;
      video.muted = !soundEnabled;

      try {
        await video.play();
      } catch (error) {
        console.log("Playback blocked:", error);
      }
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;
      video.pause();
      video.currentTime = 0;
    });
  </script>

</body>
</html>
